<head>

<link rel="apple-touch-icon" href="icone-192.png">

<title>Acompanhe sua revisão — Matheus Motos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--texto:#f5f5f7;--suave:#a0a0aa;--linha:#2a2a30;--verm:#e1101a;--ok:#2fbf71;--alerta:#f5a524;--azul:#4da3ff;
--tit:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--corpo:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0a0a0c}
body{margin:0;color:var(--texto);font-family:var(--corpo);font-size:16px;line-height:1.4;min-height:100vh;overflow-x:hidden;position:relative}
html,body{background:#0a0a0c}
main{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:4px 2px 14px}
header img{height:50px;width:50px;object-fit:contain;border-radius:50%}
header .nome{font-family:var(--tit);font-style:italic;font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.5px}
header .nome small{display:block;font-family:var(--corpo);font-style:normal;font-weight:500;font-size:12px;color:var(--suave);letter-spacing:0;text-transform:none;margin-top:3px}
.chipn{margin-left:auto;background:rgba(255,255,255,.07);border:1px solid var(--linha);border-radius:99px;padding:5px 11px;font-size:12px;color:var(--suave);white-space:nowrap}
.card{background:rgba(22,22,26,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--linha);border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.card h2{margin:0 0 12px;font-family:var(--tit);font-style:italic;font-weight:800;font-size:20px;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.chip{font-family:var(--corpo);font-style:normal;font-size:12px;font-weight:600;background:var(--verm);color:#fff;border-radius:99px;padding:2px 9px;letter-spacing:0}
.chip:empty{display:none}
.entra{animation:sobe .7s cubic-bezier(.2,.8,.2,1) both}
.entra:nth-of-type(2){animation-delay:.08s}.entra:nth-of-type(3){animation-delay:.16s}.entra:nth-of-type(4){animation-delay:.24s}.entra:nth-of-type(5){animation-delay:.32s}
@keyframes sobe{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
/* topo: saudação + placa + faixa de situação */
.hero{border-color:color-mix(in srgb,var(--cor,#4da3ff) 55%,#2a2a30);transition:border-color .6s}
.ola{font-family:var(--tit);font-style:italic;font-weight:800;font-size:34px;line-height:1.05;margin:0}
.moto{color:var(--suave);margin:2px 0 0;font-size:17px}
.placa{display:inline-block;background:#f4f4f4;color:#111;font-family:var(--tit);font-weight:800;font-size:28px;letter-spacing:3px;line-height:1.3;padding:0 14px;border-radius:6px;border-top:7px solid #1b4fd8;margin-top:10px;position:relative;overflow:hidden}
.placa::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);animation:passa 3.4s ease-in-out infinite}
@keyframes passa{0%,55%{left:-60%}100%{left:130%}}
.banner{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--cor,#4da3ff) 16%,transparent);border:1px solid color-mix(in srgb,var(--cor,#4da3ff) 45%,transparent);transition:all .6s}
.banner .em{line-height:1;flex:none}
.banner b{display:block;font-size:19px;font-weight:600}
.banner span.t{color:#d4d4da;font-size:15px}
.em.quica{animation:quica 1.3s ease-in-out infinite}.em.gira{animation:gira 3s linear infinite}.em.pulsa{animation:pulsa 1s ease-in-out infinite}
@keyframes quica{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px) rotate(-6deg)}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.25) rotate(8deg)}}
/* estrada com a moto andando conforme a etapa */
.road{position:relative;padding-top:42px}
.trilho{position:absolute;left:23px;right:23px;top:62px;height:6px;border-radius:9px;background:repeating-linear-gradient(90deg,#34343a 0 10px,transparent 10px 18px)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--ok),var(--alerta));width:0;transition:width 1.1s cubic-bezier(.3,.9,.3,1)}
.moto-ico{position:absolute;top:4px;left:23px;font-size:30px;display:flex;transform:translateX(-50%) scaleX(-1);transition:left 1.1s cubic-bezier(.3,.9,.3,1);animation:vibra .5s ease-in-out infinite alternate}
@keyframes vibra{from{margin-top:0}to{margin-top:-2px}}
.nos{display:flex;justify-content:space-between;position:relative}
.no{width:25%;text-align:center;font-size:12px;color:var(--suave);transition:color .5s}
.no i{display:flex;align-items:center;justify-content:center;width:46px;height:46px;margin:0 auto 6px;border-radius:50%;background:#1b1b20;border:2px solid var(--linha);color:var(--suave);font-style:normal;font-size:22px;transition:all .5s}
.no.feito{color:var(--texto)}.no.feito i{background:var(--ok);border-color:var(--ok);color:#04130a}
.no.atual{color:#fff;font-weight:600}.no.atual i{background:var(--alerta);border-color:var(--alerta);color:#1a1000;animation:anel 1.6s infinite}
@keyframes anel{0%{box-shadow:0 0 0 0 rgba(245,165,36,.7)}100%{box-shadow:0 0 0 14px rgba(245,165,36,0)}}
.datas{margin:14px 0 0;font-size:13px;color:var(--suave);line-height:1.7}
/* ícones planos (SVG, sem emoji 3D) */
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.card h2 .ico{color:var(--verm);font-size:22px}
.banner .em{color:var(--cor);font-size:38px;display:flex}
.peca .ic{color:var(--suave);display:flex;font-size:22px}
.vazio .em{color:var(--suave);display:flex}
.moto-ico{color:#fff}
/* peças */
.peca{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--linha);margin-bottom:8px}
.peca:last-child{margin-bottom:0}
.peca .ic{font-size:22px;flex:none}
.peca .nm{flex:1;font-weight:500}
.peca b{color:var(--ok);font-size:15px;white-space:nowrap;background:rgba(47,191,113,.12);padding:3px 10px;border-radius:99px}
.peca.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.peca.nova{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both,destaque 2.2s ease-out 3}
.peca .novo{background:var(--verm);color:#fff;font-size:10px;font-weight:600;letter-spacing:.5px;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle;animation:pulsa 1s infinite}
@keyframes pop{from{opacity:0;transform:scale(.7) translateX(-18px)}to{opacity:1;transform:none}}
@keyframes destaque{0%{box-shadow:0 0 0 0 rgba(225,16,26,.8);border-color:var(--verm)}100%{box-shadow:0 0 0 16px rgba(225,16,26,0)}}
.vazio{color:var(--suave);margin:0;display:flex;gap:10px;align-items:center}
.vazio .em{font-size:26px}
/* fotos */
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foto{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(110deg,#1b1b20 30%,#2a2a31 50%,#1b1b20 70%);background-size:200% 100%;animation:brilhoFoto 1.4s linear infinite;aspect-ratio:4/3;cursor:zoom-in;border:1px solid var(--linha)}
.foto.ok{animation:none;background:#000}
.foto img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transform:scale(1.08);transition:opacity .6s,transform .8s}
.foto.ok img{opacity:1;transform:none}
.foto:active img{transform:scale(1.04)}
.foto figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.foto.nova{animation:pop .6s both,destaque 2.2s ease-out 3}
@keyframes brilhoFoto{to{background-position:-200% 0}}
.rod{text-align:center;color:var(--suave);font-size:13px;margin-top:4px}
.rod span{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:7px;animation:ponto 1.6s infinite}
@keyframes ponto{0%{box-shadow:0 0 0 0 rgba(47,191,113,.8)}100%{box-shadow:0 0 0 10px rgba(47,191,113,0)}}
/* aviso que desce quando chega novidade */
#aviso{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));max-width:496px;margin:0 auto;z-index:20;background:linear-gradient(90deg,#e1101a,#ff7a18);color:#fff;border-radius:14px;padding:14px 16px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.6);transform:translateY(-140%);transition:transform .5s cubic-bezier(.2,1.2,.4,1)}
#aviso.on{transform:none}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;padding:10px;z-index:30;animation:sobe .3s both}
#zoom img{max-width:100%;max-height:100%;border-radius:10px}
.confete{position:fixed;top:-20px;width:9px;height:14px;z-index:25;pointer-events:none;animation:cai linear forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(720deg)}}
.erro{text-align:center;padding:40px 14px}.erro .em{font-size:54px;display:block;margin-bottom:8px;color:var(--suave)}

/* MAPA DA MOTO */
.mapa{background:#0a0a0c;border:1px solid var(--linha);border-radius:14px;padding:6px}
.mapa svg{width:100%;height:auto;display:block}
.mapa .fx{fill:none;stroke:#3a3a42;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.mapa .zs{fill:transparent;stroke:#7a7a85;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:all .25s}
.mapa .hit{fill:transparent;stroke:transparent;stroke-width:20}
.mapa .z{cursor:pointer}
.mapa .z.tem .zs{stroke:var(--ok);fill:rgba(47,191,113,.2);filter:drop-shadow(0 0 4px rgba(47,191,113,.7))}
.mapa .z.sel .zs{stroke:var(--verm);fill:rgba(225,16,26,.28);filter:drop-shadow(0 0 6px rgba(225,16,26,.8))}
.mapa .z.nova .zs{animation:zp .9s ease-in-out infinite alternate}
@keyframes zp{to{stroke-width:7}}
.mapa .bd circle{fill:var(--ok)}.mapa .bd text{fill:#04130a;font:700 12px Barlow,sans-serif;text-anchor:middle;pointer-events:none}
.mapa .z.sel .bd circle{fill:var(--verm)}.mapa .z.sel .bd text{fill:#fff}
.zdet{margin-top:10px}.zdet>b{display:block;margin-bottom:6px}
.zi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);margin-bottom:6px}.zi span{flex:1}
.zt{display:block;color:var(--suave);font-size:12px;font-weight:400}
.sg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sg button{background:#0a0a0c;border:1px solid var(--linha);color:var(--texto);border-radius:99px;padding:6px 12px;font:500 13px var(--corpo)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* O QUE É ESTE ARQUIVO: a página que o cliente abre pelo link do WhatsApp.
   Ela só LÊ os dados da moto dele (pelo token do link) e se atualiza sozinha a cada poucos segundos. */
const URL_ = "https://gbfsfxttlrwzqqjrbrvh.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiZnNmeHR0bHJ3enFxanJicnZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMjQyNDgsImV4cCI6MjEwNjkwMDI0OH0.2RyTC3gl9EY3L0HZHLttG9wdNIzpXtGIGGX2_okjyBQ";
const token = (() => { let t = new URLSearchParams(location.search).get('t') || ''; try { if (t) localStorage.setItem('mm_cli_t', t); else t = localStorage.getItem('mm_cli_t') || ''; } catch {} return t; })(); // guarda o link: o app instalado abre direto na moto do cliente
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hora = d => new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(',', ' às');
async function rpc(nome, args) {
  const r = await fetch(URL_ + '/rest/v1/rpc/' + nome, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || 'erro');
  return j;
}
const IC = { // ícones simples de linha (nada de emoji colorido)
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
  check: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  spin: '<path d="M21 12a9 9 0 1 1-6.22-8.56"/>',
  nut: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><circle cx="12" cy="12" r="3"/>',
  cam: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  moto: '<circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M5.5 17 9 10h5l3 3.5 1.5 3.5M9 10 7.5 7H5M14 10l1.5-4H18"/>'
};
const ic = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const IDX = { aberta: 0, andamento: 1, pronta: 2, entregue: 3 };
const INFO = {
  aberta:    { em: 'inbox', anim: 'quica', cor: '#4da3ff', tit: 'Moto recebida',        txt: 'Já estamos com a sua moto. Em breve o serviço começa.' },
  andamento: { em: 'spin', anim: 'gira',  cor: '#f5a524', tit: 'Serviço em andamento', txt: 'Estamos trabalhando na sua moto agora.' },
  pronta:    { em: 'flag', anim: 'pulsa', cor: '#2fbf71', tit: 'Pronta para retirar!', txt: 'Pode vir buscar a sua moto. Boa estrada!' },
  entregue:  { em: 'check', anim: 'quica', cor: '#2fbf71', tit: 'Moto entregue',        txt: 'Obrigado pela preferência! Volte sempre.' }
};

/* ===== MAPA DA MOTO: desenho de lado; cada ponto é uma "zona" que o mecânico toca e o cliente vê acender ===== */
const ZN=[
{id:'pneu_t',n:'Pneu traseiro',b:[50,140],s:['<circle cx="80" cy="170" r="44"/>'],g:['Pneu','Câmara de ar','Válvula','Rolamento da roda','Raio']},
{id:'pneu_d',n:'Pneu dianteiro',b:[372,140],s:['<circle cx="340" cy="170" r="44"/>'],g:['Pneu','Câmara de ar','Válvula','Rolamento da roda','Raio']},
{id:'paralama',n:'Paralama / lataria',b:[340,108],s:['<path d="M298 134 Q340 90 382 134"/>'],g:['Paralama','Carenagem','Lateral','Adesivo']},
{id:'amort',n:'Suspensão traseira',b:[133,128],s:['<path d="M142 102 L124 156"/>'],g:['Amortecedor','Mola','Bucha','Rolamento do balança']},
{id:'escape',n:'Escapamento',b:[160,201],s:['<path d="M240 172 Q240 202 204 201 L196 201"/>','<rect x="124" y="192" width="72" height="18" rx="8"/>'],g:['Escapamento','Silencioso','Abraçadeira','Junta do escape']},
{id:'trans',n:'Transmissão (corrente)',b:[128,172],s:['<path d="M80 154 L176 160"/>','<path d="M80 186 L176 184"/>','<circle cx="176" cy="172" r="12"/>'],g:['Kit relação','Corrente','Coroa','Pinhão','Tensor']},
{id:'motor',n:'Motor',b:[226,148],s:['<rect x="190" y="116" width="72" height="56" rx="10"/>','<path d="M200 116 L210 102 L250 102 L252 116"/>'],g:['Óleo do motor','Vela','Filtro de óleo','Junta','Pistão / anéis','Cabeçote','Válvulas']},
{id:'filtro',n:'Filtro de ar / injeção',b:[281,127],s:['<rect x="268" y="112" width="26" height="30" rx="6"/>'],g:['Filtro de ar','Carburador','Corpo de injeção','Bico injetor','Mangueira']},
{id:'bateria',n:'Bateria / elétrica',b:[163,132],s:['<rect x="148" y="120" width="30" height="24" rx="4"/>'],g:['Bateria','Regulador','CDI / ECU','Fusível','Chicote','Motor de partida']},
{id:'tanque',n:'Tanque / combustível',b:[205,84],s:['<path d="M150 96 Q158 64 200 64 L246 68 Q262 82 250 100 L160 104 Z"/>'],g:['Tanque','Torneira','Bomba de combustível','Tampa do tanque','Filtro de gasolina']},
{id:'banco',n:'Banco',b:[108,97],s:['<path d="M66 96 Q72 84 108 86 L150 92 L150 104 L76 108 Q62 106 66 96 Z"/>'],g:['Banco / capa','Fechadura do banco','Espuma']},
{id:'lanterna',n:'Lanterna / rabeta',b:[52,95],s:['<path d="M42 88 L62 86 L64 104 L44 102 Z"/>'],g:['Lanterna','Lâmpada','Pisca traseiro','Suporte da placa','Rabeta']},
{id:'garfo',n:'Suspensão dianteira',b:[322,124],s:['<path d="M340 170 L304 78"/>'],g:['Retentor do garfo','Óleo do garfo','Bengala','Bucha','Rolamento de direção']},
{id:'guidao',n:'Guidão / painel',b:[305,44],s:['<path d="M284 66 L326 54"/>'],g:['Manete','Punho','Retrovisor','Painel','Cabo do acelerador','Pisca']},
{id:'farol',n:'Farol',b:[343,76],s:['<ellipse cx="326" cy="90" rx="12" ry="14"/>'],g:['Lâmpada do farol','Farol','Pisca','Lente']},
{id:'freio_t',n:'Freio traseiro',b:[80,170],s:['<circle cx="80" cy="170" r="16"/>'],g:['Pastilha','Sapata','Disco de freio','Fluido de freio','Cabo do freio']},
{id:'freio_d',n:'Freio dianteiro',b:[340,170],s:['<circle cx="340" cy="170" r="16"/>'],g:['Pastilha','Disco de freio','Fluido de freio','Pinça','Cabo do freio']}
];
const ZNOME=Object.fromEntries(ZN.map(z=>[z.id,z.n]));
const ZFX='<g class="fx"><path d="M10 215 L410 215" stroke-dasharray="6 8"/><circle cx="80" cy="170" r="28"/><circle cx="340" cy="170" r="28"/><path d="M304 78 L258 100 L190 116 L178 160"/><path d="M80 170 L176 172"/></g>';

    ? d.fotos.map(f => `<figure class="foto ${!primeira && !fotosVistas.has(f.id) ? 'nova' : ''}" data-id="${f.id}" style="margin:0"><img alt="Foto do serviço">${f.legenda ? `<figcaption>${esc(f.legenda)}</figcaption>` : ''}</figure>`).join('')
    : `<p class="vazio"><span class="em">${ic('cam')}</span>As fotos do serviço vão aparecer aqui.</p>`;
  d.fotos.forEach(f => { fotosVistas.add(f.id); carregaFoto(f.id); });
  aplicaFotos();
}
async function carregaFoto(id) {
  if (cacheFoto[id]) return; cacheFoto[id] = 'carregando';
  try { cacheFoto[id] = await rpc('pdv_acompanhar_foto', { p_token: token, p_foto: id }) || ''; aplicaFotos(); } catch { delete cacheFoto[id]; }
}
function aplicaFotos() {
  document.querySelectorAll('.foto').forEach(f => { const s = cacheFoto[f.dataset.id], im = f.querySelector('img'); if (s && s !== 'carregando' && im.getAttribute('src') !== s) { im.onload = () => f.classList.add('ok'); im.src = s; } });
}
function pintaRodape() {
  if (!dados) return; const m = Math.max(0, Math.round((Date.now() - new Date(dados.atualizado_em || dados.criado_em)) / 60000));
  $('#rod').innerHTML = `<span></span>Ao vivo · última novidade ${m < 1 ? 'agora mesmo' : m < 60 ? 'há ' + m + ' min' : hora(dados.atualizado_em || dados.criado_em)} · <a href="#" onclick="trocaPlaca();return false" style="color:var(--suave)">Trocar placa</a>`;
}
function desenha(d) {
  const primeira = !criado; if (primeira) monta();
  $('#num').textContent = 'Nº ' + String(d.numero).padStart(4, '0');
  if (!primeira) { // avisa o que chegou de novo enquanto o cliente está com a página aberta
    const nP = d.pecas.filter(p => !pecasVistas.has(chavePeca(p))), nF = d.fotos.filter(f => !fotosVistas.has(f.id));
    if (d.status !== statusAnt) { aviso((INFO[d.status] || INFO.aberta).tit); if (d.status === 'pronta') confete(); }
    else if (nP.length) aviso('Peça trocada: ' + nP[nP.length - 1].descricao + (nP[nP.length - 1].zona && ZNOME[nP[nP.length - 1].zona] ? ' · ' + ZNOME[nP[nP.length - 1].zona] : ''));
    else if (nF.length) aviso('Nova foto do serviço!');
  } else if (d.status === 'pronta') setTimeout(confete, 900);
  const nv = primeira ? [] : [...new Set(d.pecas.filter(p => p.zona && !pecasVistas.has(chavePeca(p))).map(p => p.zona))];
  if (nv.length) zSel = nv[nv.length - 1]; // a moto já abre mostrando o lugar da peça nova
  pintaHero(d); pintaEstrada(d); pintaPecas(d, primeira); pintaMapa(d, nv); pintaFotos(d, primeira);
  statusAnt = d.status; dados = d; pintaRodape();
}
async function atualiza() {
  try {
    const d = await rpc('pdv_acompanhar', { p_token: token }); falhas = 0;
    const s = JSON.stringify(d); if (s !== ultimo) { ultimo = s; desenha(d); }
  } catch (e) {
    if (!ultimo) $('#app').innerHTML = '<div class="card erro"><span class="em">' + ic('search') + '</span><h2 style="justify-content:center">Link não encontrado</h2><p class="vazio" style="justify-content:center">Confira a placa ou peça um novo link à Matheus Motos.</p><p style="margin-top:16px"><a href="#" onclick="trocaPlaca();return false" style="color:var(--suave)">Entrar pela placa</a></p></div>';
    else if (++falhas > 3) $('#rod').textContent = 'Sem conexão… tentando de novo';
  }
}
document.addEventListener('click', e => {
  const f = e.target.closest('.foto.ok');
  if (f) { $('#zoom img').src = f.querySelector('img').src; $('#zoom').style.display = 'flex'; } else if (e.target.closest('#zoom')) $('#zoom').style.display = 'none';
});
document.addEventListener('click', e => { const z = e.target.closest('#mapa [data-z]'); if (z && dados) { zSel = zSel === z.dataset.z ? '' : z.dataset.z; pintaMapa(dados); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) atualiza(); });
/* ===== ENTRADA PELA PLACA (sem link) ===== */
function trocaPlaca() { try { localStorage.removeItem('mm_cli_t'); } catch {} location.replace(location.pathname); }
function telaPlaca(msg) {
  $('#app').innerHTML = `<div class="card erro" style="padding:28px 18px"><img src="logo.png" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:contain;margin-bottom:12px"><h2 style="justify-content:center;margin-bottom:6px">Acompanhe sua moto</h2><p class="vazio" style="justify-content:center;margin-bottom:16px">Digite a placa da sua moto para ver o que está acontecendo.</p>
  <form id="fPl"><input id="pl" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC1D23" style="width:100%;text-align:center;letter-spacing:4px;font:700 26px var(--corpo);text-transform:uppercase;padding:14px;border-radius:12px;border:1px solid var(--linha);background:#0a0a0c;color:var(--texto)">
  <div id="plE" style="color:var(--verm);min-height:1.3em;margin:10px 0;font-size:14px">${esc(msg || '')}</div>
  <button style="width:100%;padding:14px;border:0;border-radius:12px;background:var(--verm);color:#fff;font:600 17px var(--corpo)">Ver minha moto</button></form>
  <p style="margin-top:22px"><a href="celular/index.html" style="color:var(--suave);font-size:14px">Sou da loja</a></p></div>`;
  $('#fPl').onsubmit = async e => {
    e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true; $('#plE').textContent = '';
    try { const t = await rpc('pdv_acompanhar_placa', { p_placa: $('#pl').value }); try { localStorage.setItem('mm_cli_t', t); } catch {} location.replace(location.pathname); }
    catch (er) { b.disabled = false; $('#plE').textContent = /function|schema cache|could not find/i.test(er.message) ? 'App ainda não liberado: falta rodar o ATUALIZAR-APP.sql no Supabase.' : er.message; }
  };
}
if (token) { atualiza(); setInterval(() => { if (!document.hidden) atualiza(); }, 5000); setInterval(pintaRodape, 20000); } else telaPlaca();
/* ===== APP INSTALÁVEL (cliente) =====
   Guarda o link da moto no celular e deixa instalar na tela inicial. O manifesto é montado na hora com o token do cliente,
   assim o app instalado (inclusive no iPhone) já abre direto na moto dele. */
(function(){
 try{const base=new URL('./',location.href).href,u=new URL(location.href);u.hash='';if(token)u.searchParams.set('t',token);
  const m={name:'Matheus Motos — Minha moto',short_name:'Minha moto',lang:'pt-BR',display:'standalone',background_color:'#0a0a0c',theme_color:'#0a0a0c',start_url:u.href,scope:base,id:base+'cliente',icons:[{src:base+'icone-192.png',sizes:'192x192',type:'image/png'},{src:base+'icone-512.png',sizes:'512x512',type:'image/png'}]};
  if(token)document.getElementById('mf').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))}catch{}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw-cliente.js').catch(()=>{});
 const jaApp=matchMedia('(display-mode: standalone)').matches||navigator.standalone||!!window.Capacitor;
 let fechado='';try{fechado=localStorage.getItem('mm_cli_inst')||''}catch{}
 if(jaApp||fechado==='0'||!token)return;
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);let ev=null;
 const b=document.createElement('div');
 b.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;z-index:15;background:#1b1b20;border:1px solid var(--linha);border-radius:14px;padding:12px 14px;display:none;gap:10px;align-items:center;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)';
 b.innerHTML='<span id="iT" style="flex:1"></span><button id="iB" style="background:var(--verm);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:600 14px inherit;display:none">Instalar</button><button id="iX" aria-label="Fechar" style="background:none;border:0;color:var(--suave);font-size:20px;padding:4px 8px">✕</button>';
 document.body.appendChild(b);
 const mostra=t=>{b.querySelector('#iT').textContent=t;b.style.display='flex'};
 b.querySelector('#iX').onclick=()=>{b.style.display='none';try{localStorage.setItem('mm_cli_inst','0')}catch{}};
 b.querySelector('#iB').onclick=async()=>{if(!ev)return;ev.prompt();await ev.userChoice.catch(()=>{});ev=null;b.style.display='none'};
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;b.querySelector('#iB').style.display='block';mostra('Instale o app para acompanhar sua moto com um toque.')});
 addEventListener('appinstalled',()=>{b.style.display='none'});
 if(ios)mostra('Para instalar: toque em Compartilhar e depois em “Adicionar à Tela de Início”.');
})();
</script>
