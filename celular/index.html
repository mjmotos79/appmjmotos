<style>

<script>
const URL_="https://gbfsfxttlrwzqqjrbrvh.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiZnNmeHR0bHJ3enFxanJicnZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMjQyNDgsImV4cCI6MjEwNjkwMDI0OH0.2RyTC3gl9EY3L0HZHLttG9wdNIzpXtGIGGX2_okjyBQ";
const $=s=>document.querySelector(s);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numBR=v=>parseFloat(String(v).replace(',','.'))||0;

const mk=t=>supabase.createClient(URL_,KEY,{auth:{persistSession:false},global:{headers:t?{'x-device-token':t}:{}}});
let db,F=[],op=localStorage.getItem('mm_cel_op')||'',sess=null,tab='ini',dia=isoHoje(),CFG={};
const TABS=[['ini','📊','Relatório'],['mo','🏍️','Motos'],['es','📦','Estoque'],['gas','💸','Gastos'],['cx','🧾','Caixa'],['re','↩️','Reembolso'],['ma','🔧','Serviços'],['pr','🏷️','Promoções'],['pt','⏱️','Ponto'],['eq','👥','Equipe']];
/* perfil: admin = tudo; mecanico = Serviços + Ponto; funcionario = só Ponto. Sem perfil cadastrado = como era antes (tudo) + Ponto. */
const PERFIL_TABS={mecanico:['ma','pt'],funcionario:['pt']};
function perfilAtual(){const f=F.find(x=>x.id===op);return f&&f.perfil||''}
function tabsVisiveis(){const pf=perfilAtual();const ok=PERFIL_TABS[pf];return TABS.filter(x=>ok?ok.includes(x[0]):(pf==='admin'||!pf)&&(x[0]!=='eq'||pf==='admin'))}
const GASTOS_NOMES=['Almoço / lanche','Combustível','Peça / material','Ferramenta','Limpeza','Água / luz / internet','Transporte / frete','Vale / adiantamento','Outros'];
const FORMAS_REEMB=['Dinheiro','Pix','Estorno no cartão','Outro'];
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'err':'';clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('oculto'),e?5000:2500)}
/* ===== MODO SEM INTERNET =====
   O que é: guarda no celular a última cópia do que você já abriu (relatórios, motos, gastos) e uma "fila" do que
   você lançar sem internet. Para que serve: o app abre e funciona na loja mesmo se o Wi-Fi cair; quando a internet volta, a fila é enviada sozinha. */
const idb=new Promise((ok,no)=>{const r=indexedDB.open('mjm',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idbGet=k=>idb.then(d=>new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(undefined)})).catch(()=>undefined);
const idbSet=(k,v)=>idb.then(d=>new Promise(ok=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ok()})).catch(()=>{});
const h256=async t=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{return''}};
const LEIT=new Set(['obter_config','listar_produtos','pdv_rel_vendas','pdv_rel_fiado','pdv_rel_reembolsos','pdv_rel_gastos','pdv_fechamento_listar','listar_fiado','pdv_gasto_livre_listar','listar_vendas_reembolso','pdv_rel_manutencao','pdv_os_livre_listar','pdv_os_acomp_detalhe']);
const ckey=(n,a)=>'c:'+n+':'+JSON.stringify(a||{},(k,v)=>k==='p_pin'?undefined:v);
const isNet=m=>!navigator.onLine||/failed to fetch|networkerror|load failed|network connection|fetch/i.test(m||'');
let off=false;
async function pintaBar(){const q=(await idbGet('fila'))||[],b=$('#offbar');if(!b)return;
 const t=(off?'📴 Sem internet — mostrando o que carregou por último. ':'')+(q.length?`⏳ ${q.length} lançamento${q.length>1?'s':''} aguardando envio.`:'');b.textContent=t;b.classList.toggle('oculto',!t)}
function setOff(v){if(off!==v){off=v;pintaBar()}}
async function rpc(n,a){
 let r;try{r=await db.rpc(n,a)}catch(e){r={error:{message:String(e&&e.message||e)}}}
 if(r.error){const e=new Error(r.error.message);
  if(isNet(r.error.message)){e.net=true;setOff(true);
   if(LEIT.has(n)){const c=await idbGet(ckey(n,a));if(c!==undefined)return c.v}
   e.message='Sem internet. Conecte para fazer isso (ou abrir dados que ainda não foram carregados).'}
  throw e}
 setOff(false);if(LEIT.has(n))idbSet(ckey(n,a),{v:r.data,t:Date.now()});return r.data}
/* lançar algo: se estiver sem internet, guarda na fila e envia depois */
async function mut(n,a,desc){
 try{return{r:await rpc(n,a)}}catch(e){if(!e.net)throw e;
  const q=(await idbGet('fila'))||[];q.push({n,a,d:desc||n});await idbSet('fila',q);pintaBar();
  toast('Sem internet: guardado no celular. Envio sozinho quando voltar.');return{queued:true}}}
let enviando=false;
async function enviaFila(){if(enviando||!db)return;enviando=true;let ok=0;
 try{let q=(await idbGet('fila'))||[];
  while(q.length){const it=q[0];
   try{await rpc(it.n,it.a);ok++}catch(e){if(e.net)break;toast('Não enviou ('+it.d+'): '+e.message,1)}
   q.shift();await idbSet('fila',q)}
  if(ok)toast(ok+' lançamento'+(ok>1?'s':'')+' enviado'+(ok>1?'s':'')+' ao sistema.')}finally{enviando=false;pintaBar()}}
addEventListener('online',()=>{enviaFila()});addEventListener('offline',()=>setOff(true));
const semBanco=e=>e.net?e.message:/schema cache|could not find/i.test(e.message)?'Falta rodar o ATUALIZAR-*.sql correspondente no Supabase.':e.message;
function sheet(h){$('#sheetIn').innerHTML=h;$('#sheet').classList.remove('oculto')}
function fecha(){$('#sheet').classList.add('oculto')}
$('#sheet').onclick=e=>{if(e.target.id==='sheet')fecha()};
/* ---- autorização do celular (igual ao PC) ---- */
$('#fAuth').onsubmit=async e=>{e.preventDefault();$('#aErro').textContent='';
 const{data,error}=await mk().rpc('autorizar_pc',{p_usuario:$('#aUser').value,p_pin:$('#aPin').value,p_nome:$('#aPc').value});
 if(error)return $('#aErro').textContent='Erro ao conectar. Tente de novo.';
 if(data==='BLOQUEADO')return $('#aErro').textContent='Muitas tentativas erradas. Aguarde 15 minutos.';
 if(!data)return $('#aErro').textContent='Usuário ou senha incorretos, ou sem permissão de administrador.';
 localStorage.setItem('mm_cel_token',data);location.reload()};
async function iniciar(){
 const t=localStorage.getItem('mm_cel_token');if(!t)return $('#auth').classList.remove('oculto');
 if(typeof supabase==='undefined'){document.body.innerHTML='<p style="padding:30px;color:#fff">Abra o app uma vez com internet para ele poder funcionar sem internet.</p>';return}
 db=mk(t);const f=await db.from('pdv_funcionarios').select('*').order('nome');
 if(f.error){/* sem internet: usa a última lista guardada, NÃO tira a autorização */
  F=(await idbGet('F'))||[];setOff(true);
  if(!F.length){document.body.innerHTML='<p style="padding:30px;color:#fff">Sem internet e este celular ainda não guardou os dados. Conecte uma vez para usar offline.</p>';return}}
 else{F=f.data||[];
  if(!F.length){localStorage.removeItem('mm_cel_token');$('#msgAuth').textContent='Este celular não está autorizado (ou foi revogado). Peça ao administrador.';return $('#auth').classList.remove('oculto')}
  idbSet('F',F)}
 try{CFG=(await rpc('obter_config'))||{}}catch{}
 if(CFG.logo)document.querySelectorAll('img[data-logo]').forEach(i=>i.src=CFG.logo);
 try{if(CFG.cfg){const c=typeof CFG.cfg==='string'?JSON.parse(CFG.cfg):CFG.cfg;if(c&&c.nome)$('#nome').textContent=c.nome}}catch{}
 if(!F.some(x=>x.id===op))op='';
 $('#app').classList.remove('oculto');desenha();ir('ini');pintaBar();enviaFila()}
function opNome(){return(F.find(f=>f.id===op)||{}).nome||''}
function desenha(){$('#btnOp').textContent=opNome()||'Quem é você?';$('#btnOp').onclick=escolherOp}

 $('#sheetIn').onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;op=b.dataset.o;localStorage.setItem('mm_cel_op',op);sess=null;pareVigia();fecha();desenha();ir(tab)}}
/* ---- senha (uma vez por sessão) ---- */
function pedeSenha(perm,titulo){return new Promise((ok,no)=>{
 if(sess)return ok(sess);
 sheet(`<h2>${titulo||'Área restrita'}</h2><label>Quem é você?<select id="sId">${F.map(f=>`<option value="${f.id}" ${f.id===op?'selected':''}>${esc(f.nome)}</option>`).join('')}</select></label><label>Senha<input id="sPin" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></label><div class="erro" id="sErr"></div><button class="btn" id="sOk">Entrar</button><button class="btn sec" id="sNo" style="width:100%;margin-top:8px;padding:12px">Cancelar</button>`);
 $('#sNo').onclick=()=>{fecha();no()};
 $('#sOk').onclick=async()=>{const id=$('#sId').value,pin=$('#sPin').value;
  const nome=(F.find(f=>f.id===id)||{}).nome,h=await h256(id+':'+pin),pk='pin:'+id;
  try{const r=await rpc('verificar_acesso',{p_func:id,p_pin:pin,p_perm:perm||null});
   if(!r.ok){$('#sPin').value='';return $('#sErr').textContent=r.msg||'Senha incorreta'}
   const rec=(await idbGet(pk))||{};const oks=new Set(rec.h===h?rec.ok:[]);oks.add(perm||'');idbSet(pk,{h,ok:[...oks]});
   sess={id,pin,nome};fecha();ok(sess)}
  catch(e){if(!e.net)return $('#sErr').textContent=e.message;
   /* sem internet: só entra quem já entrou com essa mesma senha neste celular */
   const rec=await idbGet(pk);
   if(h&&rec&&rec.h===h&&rec.ok.includes(perm||'')){sess={id,pin,nome,offline:true};fecha();ok(sess)}
   else $('#sErr').textContent='Sem internet: só entra offline quem já entrou antes neste celular, com a mesma senha.'}}})}


/* ===== PONTO =====
   O que é: bater ponto com selfie + GPS (só dentro do raio da oficina). Para que serve: ficar registrado dia, hora de entrada e de saída.
   Limite do navegador: o GPS só é lido com o app ABERTO. Se a pessoa sair da oficina com o app aberto por 1 min, a saída é registrada
   sozinha (com a hora em que ela saiu). Se fechar o app, ela precisa bater a saída (ou o admin vê "entrada sem saída"). */
const distM=(a,b,c,d)=>{const t=x=>x*Math.PI/180,u=t(c-a),v=t(d-b),h=Math.sin(u/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(v/2)**2;return 12742000*Math.asin(Math.sqrt(h))};
const gps=()=>new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('Este aparelho não liberou GPS para o navegador.'));
 navigator.geolocation.getCurrentPosition(p=>ok(p.coords),e=>no(new Error(e.code===1?'Libere a Localização para este app (Configurações do celular → Apps → MJ Motos → Permissões → Localização).':'Não consegui pegar o GPS. Vá para um lugar aberto e tente de novo.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0})});
const selfie=()=>new Promise((ok,no)=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','user');
 i.onchange=()=>{const f=i.files[0];if(!f)return no(new Error('Tire a selfie para bater o ponto.'));const im=new Image();

let SVC=[];
async function carregaServ(){try{const r=await db.from('pdv_servicos').select('*').order('nome');if(!r.error&&r.data){SVC=r.data.filter(x=>x.ativo!==false);idbSet('svc',SVC)}else throw 0}catch{try{SVC=(await idbGet('svc'))||SVC}catch{}}return SVC}
function comprime(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{let w=im.width,h=im.height;const m=1100;if(Math.max(w,h)>m){const k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
  let q=.75,r=c.toDataURL('image/jpeg',q);while(r.length>650000&&q>.3){q-=.1;r=c.toDataURL('image/jpeg',q)}
  URL.revokeObjectURL(u);r.length>690000?no(new Error('Foto muito grande.')):ok(r)};
 im.onerror=()=>no(new Error('Não consegui abrir a foto.'));im.src=u})}
